name: CI

on:
  push:
    branches: ["compliance-hardening", "auth-database-foundation"]
  pull_request:

permissions:
  contents: write

jobs:
  lockfile-bootstrap:
    if: github.ref == 'refs/heads/auth-database-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-database-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:auth-database-foundation

  validate:
    needs: lockfile-bootstrap
    if: always() && (needs.lockfile-bootstrap.result == 'success' || needs.lockfile-bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-database-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:regression
      - run: npm run test:oauth-security
